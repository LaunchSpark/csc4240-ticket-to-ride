[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-to-ride"
version = "0.1.0"
description = "Native Ticket to Ride engine and backend services."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
notebooks = [
  # Floor is load-bearing, not cosmetic: every notebook in this repo uses
  # `with app.setup`, `@app.class_definition`, and `@app.function`, none of
  # which parse on older marimo. A lower floor lets a clean resolve install a
  # marimo that fails to open every bot and dashboard. Upper bound keeps the
  # generated-file format (`__generated_with`) in step with what CI checks.
  "marimo>=0.23.13,<0.24",
  "anywidget>=0.9",
  "wigglystuff>=0.1",
]
xgb = [
  "numpy>=2.0",
  "xgboost>=2.0,<4",
]

[project.scripts]
run = "ticket_to_ride.runtime.cli:run"
test = "ticket_to_ride.runtime.cli:test"

[tool.hatch.build.targets.wheel]
# Installed as editable packages so they resolve via site-packages regardless
# of sys.path/cwd anchoring — required because marimo's kernel process does
# not inherit the repo-root-relative sys.path that `uv run`/`python -m
# unittest` set up, so a bare `import external` / `import notebook_harness`
# would otherwise fail when a bot notebook is opened directly (e.g. via
# `marimo edit` or `marimo export`).
packages = [
  "services/native-runtime/src/ticket_to_ride",
  "integrations/external",
  "applications/notebook_harness",
]
